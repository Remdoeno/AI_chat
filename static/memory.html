<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旺财记忆库</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js?v=20260616_model_settings"></script>
    <link rel="stylesheet" href="/static/memory.css?v=20260618_memory_time_tags" />
  </head>
  <body>
    <main class="memory-shell">
      <header class="topbar">
        <a class="topbar-back" href="/">返回聊天</a>
        <div class="topbar-title">
          <p class="eyebrow">WANGCAI</p>
          <h1>旺财记忆库</h1>
        </div>
        <button id="refreshButton" type="button">刷新</button>
      </header>

      <section class="summary-grid" aria-label="状态汇总">
        <div class="metric">
          <span>长期记忆</span>
          <strong id="memoryCount">-</strong>
        </div>
        <div class="metric">
          <span>调用记录</span>
          <strong id="retrievalCount">-</strong>
        </div>
        <div class="metric">
          <span>系统操作</span>
          <strong id="operationCount">-</strong>
        </div>
      </section>

      <section class="panel-grid">
        <article class="panel">
          <header class="panel-header">
            <div>
              <h2>记忆</h2>
              <p>整理后的长期记忆，不含原始对话。</p>
            </div>
          </header>
          <section class="create-memory-panel" aria-label="新增记忆">
            <div class="create-memory-fields">
              <select id="newMemoryLabel">
                <option value="preference">preference</option>
                <option value="identity">identity</option>
                <option value="rule">rule</option>
                <option value="persona">persona</option>
                <option value="artifact">artifact</option>
                <option value="risk">risk</option>
                <option value="diary">diary</option>
                <option value="event">event</option>
                <option value="fact">fact</option>
                <option value="other" selected>other</option>
              </select>
              <div id="newMemoryTimeline" class="timeline-picker" aria-label="timeline"></div>
            </div>
            <textarea id="newMemoryContent" rows="4" placeholder="新增一条属于当前用户范围的记忆"></textarea>
            <div class="create-memory-actions">
              <p id="memoryEditStatus" class="muted">只显示并编辑当前共享用户范围内的记忆。</p>
              <button id="createMemoryButton" type="button">新增记忆</button>
            </div>
          </section>
          <div class="filters">
            <input id="memoryKeyword" type="search" placeholder="关键词" />
            <select id="memoryLabel">
              <option value="">全部 label</option>
              <option value="preference">preference</option>
              <option value="identity">identity</option>
              <option value="rule">rule</option>
              <option value="persona">persona</option>
              <option value="artifact">artifact</option>
              <option value="risk">risk</option>
              <option value="diary">diary</option>
              <option value="event">event</option>
              <option value="fact">fact</option>
              <option value="other">other</option>
            </select>
          </div>
          <div id="memoryList" class="list"></div>
        </article>

        <article class="panel">
          <header class="panel-header">
            <div>
              <h2>记忆调用记录</h2>
              <p>只记录 query hash、命中的 memory id 和分数。</p>
            </div>
          </header>
          <div class="filters">
            <input id="retrievalMemoryId" type="number" min="1" placeholder="memory id" />
          </div>
          <div id="retrievalList" class="list compact"></div>
        </article>

        <article class="panel wide">
          <header class="panel-header">
            <div>
              <h2>系统操作</h2>
              <p>回答、reset、后台整理、压缩任务等事件。</p>
            </div>
          </header>
          <div class="filters">
            <select id="operationKind">
              <option value="">全部类型</option>
              <option value="event">event</option>
              <option value="memory_agent_job">memory agent job</option>
            </select>
            <select id="operationStatus">
              <option value="">全部 job 状态</option>
              <option value="pending">pending</option>
              <option value="running">running</option>
              <option value="completed">completed</option>
              <option value="skipped">skipped</option>
              <option value="failed">failed</option>
              <option value="cancelled">cancelled</option>
            </select>
            <input id="operationEventType" type="search" placeholder="event type" />
          </div>
          <div id="operationList" class="list operations"></div>
        </article>
      </section>
    </main>
    <script src="/static/memory.js?v=20260618_memory_time_tags"></script>
    <script src="/static/image_viewer.js?v=20260617_image_viewer_toplayer"></script>
  </body>
</html>
