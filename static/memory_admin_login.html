<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旺财记忆库登录</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js?v=3_3_0"></script>
    <link rel="stylesheet" href="/static/styles.css?v=3_3_0" />
    <link rel="stylesheet" href="/static/password_visibility.css?v=3_3_0" />
    <link rel="stylesheet" href="/static/ui_foundation.css?v=3_3_0" />
  <script src="/static/ui_accessibility.js?v=3_3_0" defer></script>
</head>
  <body class="login-page">
    <main class="admin-login-dialog login-panel">
      <form id="memoryAdminLoginForm" data-login-password="memoryAdminPassword" data-login-status="memoryAdminLoginStatus" data-login-next="/memory-admin" class="admin-login-form">
        <h2>记忆后台</h2>
        <label class="field" for="memoryAdminPassword">
          <span>管理员密码</span>
          <input id="memoryAdminPassword" type="password" autocomplete="current-password" required autofocus />
        </label>
        <p id="memoryAdminLoginStatus" class="dialog-status"></p>
        <div class="dialog-actions">
          <a class="secondary-button compact-button" href="/">返回聊天</a>
          <button class="primary-button compact-button" type="submit">进入</button>
        </div>
      </form>
    </main>
    <script src="/static/ui_admin_login.js?v=3_3_0" defer></script>
    <script src="/static/password_visibility.js?v=3_3_0"></script>
    <script src="/static/image_viewer.js?v=3_3_0"></script>
  </body>
</html>
