<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旺财后台登录</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js?v=20260814_shared_user_auth"></script>
    <link rel="stylesheet" href="/static/analysis.css?v=20260814_shared_user_auth" />
    <link rel="stylesheet" href="/static/password_visibility.css?v=20260816_wangcai_2_4" />
  </head>
  <body class="analysis-login-page">
    <main class="analysis-login-card">
      <p class="analysis-kicker">WANGCAI ADMIN</p>
      <h1>旺财后台观测</h1>
      <p class="analysis-muted">该入口显示全局服务状态，仅管理员可进入。</p>
      <form id="backgroundLoginForm" class="analysis-login-form">
        <label for="backgroundPassword">管理员密码</label>
        <input id="backgroundPassword" type="password" autocomplete="current-password" required />
        <p id="backgroundLoginStatus" class="analysis-status"></p>
        <button type="submit">进入</button>
      </form>
    </main>
    <script>
      const form = document.getElementById("backgroundLoginForm");
      const password = document.getElementById("backgroundPassword");
      const statusText = document.getElementById("backgroundLoginStatus");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        statusText.textContent = "验证中";
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: password.value }),
        });
        if (!response.ok) {
          statusText.textContent = "管理员密码错误";
          password.select();
          return;
        }
        window.location.href = "/background";
      });
    </script>
    <script src="/static/password_visibility.js?v=20260816_wangcai_2_4"></script>
  </body>
</html>
