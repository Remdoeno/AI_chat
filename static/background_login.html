<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旺财后台登录</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js?v=3_3_0"></script>
    <link rel="stylesheet" href="/static/analysis.css?v=3_3_0" />
    <link rel="stylesheet" href="/static/password_visibility.css?v=3_3_0" />
    <link rel="stylesheet" href="/static/ui_foundation.css?v=3_3_0" />
  <script src="/static/ui_accessibility.js?v=3_3_0" defer></script>
</head>
  <body class="analysis-login-page">
    <main class="analysis-login-card">
      <p class="analysis-kicker">WANGCAI ADMIN</p>
      <h1>旺财后台观测</h1>
      <p class="analysis-muted">该入口显示全局服务状态，仅管理员可进入。</p>
      <form id="backgroundLoginForm" data-login-password="backgroundPassword" data-login-status="backgroundLoginStatus" data-login-next="/background" class="analysis-login-form">
        <label for="backgroundPassword">管理员密码</label>
        <input id="backgroundPassword" type="password" autocomplete="current-password" required />
        <p id="backgroundLoginStatus" class="analysis-status"></p>
        <button type="submit">进入</button>
      </form>
      <a class="secondary-link" href="/">返回聊天</a>
    </main>
    <script src="/static/ui_admin_login.js?v=3_3_0" defer></script>
    <script src="/static/password_visibility.js?v=3_3_0"></script>
  </body>
</html>
