<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旺财记忆库</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js?v=20260618_wangcai_rename"></script>
    <link rel="stylesheet" href="/static/memory_admin.css?v=20260814_shared_user_memory_auth" />
  </head>
  <body>
    <main class="admin-shell">
      <aside class="admin-side">
        <a class="back-link" href="/">返回聊天</a>
        <div class="brand">
          <p>WANGCAI</p>
          <h1>旺财记忆库</h1>
        </div>

        <label class="field" for="keywordInput">
          <span>关键词</span>
          <input id="keywordInput" type="search" autocomplete="off" />
        </label>

        <label class="field" for="labelFilter">
          <span>标签</span>
          <select id="labelFilter">
            <option value="">全部</option>
            <option value="preference">preference</option>
            <option value="identity">identity</option>
            <option value="rule">rule</option>
            <option value="persona">persona</option>
            <option value="risk">risk</option>
            <option value="diary">diary</option>
            <option value="event">event</option>
            <option value="fact">fact</option>
            <option value="other">other</option>
          </select>
        </label>

        <label class="field" for="deviceFilter">
          <span>设备身份</span>
          <input id="deviceFilter" type="search" autocomplete="off" />
        </label>

        <button id="refreshButton" class="button" type="button">刷新</button>
        <p id="statusText" class="status">读取中</p>

        <section class="create-panel" aria-label="新增记忆">
          <h2>新增记忆</h2>
          <label class="field" for="newLabel">
            <span>标签</span>
            <select id="newLabel">
              <option value="preference">preference</option>
              <option value="identity">identity</option>
              <option value="rule">rule</option>
              <option value="persona">persona</option>
              <option value="risk">risk</option>
              <option value="diary">diary</option>
              <option value="event">event</option>
              <option value="fact">fact</option>
              <option value="other" selected>other</option>
            </select>
          </label>
          <label class="field" for="newIp">
            <span>关联设备身份</span>
            <input id="newIp" type="text" autocomplete="off" placeholder="留空则关联当前共享用户的主机设备" />
          </label>
          <label class="field" for="newTimeline">
            <span>Timeline</span>
            <div id="newTimeline" class="timeline-picker" aria-label="Timeline"></div>
          </label>
          <label class="field" for="newContent">
            <span>内容</span>
            <textarea id="newContent" rows="6"></textarea>
          </label>
          <button id="createButton" class="button" type="button">新增</button>
        </section>
      </aside>

      <section class="admin-content">
        <div class="section-head">
          <h2>记忆列表</h2>
          <span id="memoryCount">0</span>
        </div>
        <div id="memoryList" class="memory-list"></div>
      </section>
    </main>
    <script src="/static/device_identity.js?v=20260816_wangcai_2_4"></script>
    <script src="/static/memory_admin.js?v=20260816_wangcai_2_4"></script>
    <script src="/static/image_viewer.js?v=20260617_image_viewer_toplayer"></script>
  </body>
</html>
