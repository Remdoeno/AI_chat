<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旺财记忆库</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js?v=3_3_0"></script>
    <link rel="stylesheet" href="/static/memory_admin.css?v=3_3_0" />
    <link rel="stylesheet" href="/static/ui_foundation.css?v=3_3_0" />
  <script src="/static/ui_accessibility.js?v=3_3_0" defer></script>
</head>
  <body>
    <main class="admin-shell">
      <aside class="admin-side">
        <a class="back-link" href="/">返回聊天</a>
        <div class="brand">
          
          <h1>全局记忆后台</h1>
        </div>

        <section class="user-scope-panel" aria-labelledby="userScopeTitle">
          <div class="user-scope-head">
            <h2 id="userScopeTitle">用户范围</h2>
            <span id="userScopeCount">0 位</span>
          </div>
          <div id="userScopeList" class="user-scope-list" role="listbox" aria-label="按共享用户筛选记忆"></div>
        </section>

        <label class="field" for="keywordInput">
          <span>关键词</span>
          <input id="keywordInput" type="search" autocomplete="off" />
        </label>

        <label class="field" for="labelFilter">
          <span>标签</span>
          <select id="labelFilter">
            <option value="">全部</option>
            <option value="preference">偏好</option>
            <option value="identity">身份</option>
            <option value="rule">约定</option>
            <option value="persona">性格</option>
            <option value="risk">注意事项</option>
            <option value="diary">日记</option>
            <option value="event">事项</option>
            <option value="fact">事实</option>
            <option value="other">其他</option>
          </select>
        </label>

        <label class="field" for="deviceFilter">
          <span>设备身份</span>
          <input id="deviceFilter" type="search" autocomplete="off" />
        </label>

        <button id="refreshButton" class="button" type="button">刷新</button>
        <p id="statusText" class="status" role="status" aria-live="polite">读取中</p>

        <details class="create-disclosure"><summary>新增记忆</summary>
        <section class="create-panel" aria-label="新增记忆">
          <label class="field" for="newLabel">
            <span>标签</span>
            <select id="newLabel">
              <option value="preference">偏好</option>
              <option value="identity">身份</option>
              <option value="rule">约定</option>
              <option value="persona">性格</option>
              <option value="risk">注意事项</option>
              <option value="diary">日记</option>
              <option value="event">事项</option>
              <option value="fact">事实</option>
              <option value="other" selected>其他</option>
            </select>
          </label>
          <label class="field" for="newIp">
            <span>关联设备身份</span>
            <input id="newIp" type="text" autocomplete="off" placeholder="留空则保存为全局记忆" />
          </label>
          <label class="field" for="newTimeline">
            <span>时间</span>
            <div id="newTimeline" class="timeline-picker" aria-label="时间"></div>
          </label>
          <label class="field" for="newContent">
            <span>内容</span>
            <textarea id="newContent" rows="6"></textarea>
          </label>
          <button id="createButton" class="button" type="button">新增</button>
        </section></details>
      </aside>

      <section class="admin-content">
        <div class="section-head">
          <h2>记忆列表</h2>
          <div class="section-summary">
            <span id="activeUserScope">全部用户</span>
            <span id="memoryCount">0 条</span>
          </div>
        </div>
        <div id="memoryList" class="memory-list"></div>
      </section>
    </main>
    <script src="/static/device_identity.js?v=3_3_0"></script>
    <script src="/static/ui_memory.js?v=3_3_0"></script>
    <script src="/static/memory_admin.js?v=3_3_0"></script>
    <script src="/static/image_viewer.js?v=3_3_0"></script>
  </body>
</html>
