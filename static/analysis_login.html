<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旺财分析模式登录</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js?v=20260814_shared_user_auth"></script>
    <link rel="stylesheet" href="/static/analysis.css?v=20260814_shared_user_auth" />
    <link rel="stylesheet" href="/static/password_visibility.css?v=20260816_wangcai_2_4" />
    <link rel="stylesheet" href="/static/tutorial.css?v=20260816_wangcai_2_4" />
  </head>
  <body class="analysis-login-page">
    <main class="analysis-login-card">
      <p class="analysis-kicker">WANGCAI</p>
      <h1>旺财分析模式</h1>
      <p id="analysisLoginHint" class="analysis-muted">读取共享用户状态中。</p>
      <form id="analysisLoginForm" class="analysis-login-form" hidden>
        <label for="analysisPassword">共享用户密码</label>
        <input id="analysisPassword" type="password" autocomplete="current-password" minlength="6" required />
        <label id="analysisConfirmField" for="analysisPasswordConfirm" hidden>确认新密码</label>
        <input id="analysisPasswordConfirm" type="password" autocomplete="new-password" minlength="6" hidden />
        <p id="analysisLoginStatus" class="analysis-status"></p>
        <button type="submit">进入</button>
      </form>
      <a id="analysisReturnLink" class="secondary-link" href="/" hidden>返回聊天并绑定共享用户</a>
    </main>
    <script src="/static/device_identity.js?v=20260816_wangcai_2_4"></script>
    <script src="/static/tutorial.js?v=20260816_wangcai_2_4"></script>
    <script src="/static/analysis_login.js?v=20260818_admin_memory_separation"></script>
    <script src="/static/password_visibility.js?v=20260816_wangcai_2_4"></script>
  </body>
</html>
