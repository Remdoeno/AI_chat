<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>旺财分析模式</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js?v=3_3_0"></script>
    <link rel="stylesheet" href="/static/analysis.css?v=3_3_0" />
    <link rel="stylesheet" href="/static/tutorial.css?v=3_3_0" />
    <link rel="stylesheet" href="/static/release_controls.css?v=3_3_0" />
    <link rel="stylesheet" href="/static/ui_workspace.css?v=3_3_0" />
    <link rel="stylesheet" href="/static/ui_foundation.css?v=3_3_0" />
  <script src="/static/ui_accessibility.js?v=3_3_0" defer></script>
</head>
  <body>
    <main id="analysisMode" class="analysis-shell" data-workspace="analysis" data-breakpoint="1100" data-default-panel="chat">
      <nav class="workspace-switcher" aria-label="分析模式视图">
        <a href="/" class="workspace-back">返回聊天</a>
        <div role="group" aria-label="查看内容">
          <button type="button" data-workspace-target="chat" aria-controls="analysisChatSurface" aria-pressed="true">聊天</button>
          <button type="button" data-workspace-target="trace" aria-controls="analysisTraceSurface" aria-pressed="false">明细</button>
          <button type="button" data-workspace-target="tasks" aria-controls="analysisTasksSurface" aria-pressed="false">任务</button>
        </div>
      </nav>
      <section id="analysisChatSurface" data-workspace-panel="chat" class="analysis-chat" aria-label="分析模式聊天">
        <header class="analysis-chat-header">
          <div class="analysis-topbar">
            <a class="analysis-back analysis-back-button" href="/" aria-label="返回聊天主页">返回聊天</a>
            <div class="analysis-title-block">
              <p id="analysisModelDisplayName" class="analysis-kicker analysis-model-kicker">读取中</p>
              <h1>旺财分析模式</h1>
            </div>
          </div>
          <div class="analysis-status-row">
            <div class="analysis-field analysis-status-field">
              <span>状态</span>
              <strong id="statusText" role="status">连接中</strong>
            </div>
            <button id="resetButton" class="analysis-secondary analysis-reset-button" type="button">新对话</button>
          </div>
        </header>
        <div class="analysis-chat-history-actions">
          <button id="loadPreviousButton" class="analysis-secondary analysis-load-previous-button" type="button">加载上一段对话</button>
        </div>
        <div id="messages" class="analysis-messages"></div>
        <form id="chatForm" class="analysis-composer">
          <div class="analysis-input-stack">
            <textarea id="messageInput" rows="3" placeholder="输入消息"></textarea>
            <div id="analysisAttachmentPreview" class="analysis-attachment-preview" aria-label="已选择图片"></div>
            <div class="analysis-tools">
              <button id="analysisAttachImageButton" class="analysis-secondary" type="button">图片</button>
              <button id="analysisWebSearchButton" class="analysis-secondary analysis-toggle-tool-button" type="button" aria-pressed="false">联网</button>
              <button id="analysisDrawButton" class="analysis-secondary analysis-toggle-tool-button" type="button" aria-pressed="false" aria-label="启用画图" title="启用画图">画图</button>
              <input id="webSearchInput" type="checkbox" hidden />
              <input id="analysisImageInput" type="file" accept="image/*,.avif,.bmp,.gif,.heic,.heif,.ico,.jfif,.jpg,.jpeg,.pjpeg,.png,.svg,.tif,.tiff,.webp" multiple hidden />
            </div>
          </div>
          <button id="sendButton" type="submit">发送</button>
        </form>
      </section>

      <section class="analysis-trace" data-workspace-container aria-label="后台详情">
        <div id="analysisTraceSurface" data-workspace-panel="trace">
        <div class="analysis-trace-header">
          <div>
            
            <h2>后台明细</h2>
          </div>
        </div>
        <div id="tracePanel" class="trace-panel"></div>
        </div>
        <div id="analysisTasksSurface" data-workspace-panel="tasks">
        <div class="analysis-trace-header analysis-background-header">
          <div>
            
            <h2>后台任务</h2>
          </div>
        </div>
        <div id="backgroundPanel" class="background-panel"></div>
        <button id="backgroundMoreButton" class="analysis-secondary background-more-button" type="button">显示更多</button>
        </div>
      </section>
    </main>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
        }
      };
      window.addEventListener("DOMContentLoaded", () => {
        window.setTimeout(() => {
          const status = document.getElementById("statusText");
          const text = status ? status.textContent.trim() : "";
          if (status && !window.__wangcaiAnalysisStarted && (text === "连接中" || text === "脚本加载中")) {
            status.textContent = "分析脚本未启动，请强制刷新";
          }
        }, 5000);
      });
    </script>
    <script src="/static/tutorial.js?v=3_3_0"></script>
    <script src="/static/release_controls.js?v=3_3_0"></script>
    <script
      src="/static/analysis.js?v=3_3_0"
      onerror="document.getElementById('statusText').textContent='analysis.js 加载失败'"
    ></script>
    <script src="/static/image_viewer.js?v=3_3_0"></script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <script src="/static/ui_workspace.js?v=3_3_0"></script>
  </body>
</html>
